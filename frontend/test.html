<!DOCTYPE html>
<html>

<head>
    <title>Private Chat Test</title>
</head>

<body>

    <h2>Private Chat</h2>

    <h3 id="username"></h3>

    <input id="receiver" placeholder="Receiver Username">

    <br><br>

    <input id="message" placeholder="Type a message">

    <button onclick="broadcastMessage()">
        Broadcast
    </button>

    <button onclick="privateMessage()">
        Private Message
    </button>

    <h3>Messages</h3>

    <ul id="messages"></ul>

    <script>

        const username = prompt("Enter your username");

        document.getElementById("username").textContent =
            `Logged in as: ${username}`;

        const ws = new WebSocket("ws://127.0.0.1:8000/ws");

        ws.onopen = () => {

            console.log("Connected");

            ws.send(JSON.stringify({
                type: "register",
                username: username
            }));

        };

        ws.onmessage = (event) => {

            const data = JSON.parse(event.data);

            console.log("Received:", data);

            const li = document.createElement("li");

            li.textContent =
                `[${data.type}] ${data.sender}: ${data.message}`;

            document.getElementById("messages").appendChild(li);

        };

        ws.onerror = (error) => {

            console.error(error);

        };

        ws.onclose = () => {

            console.log("Disconnected");

        };

        function broadcastMessage() {

            const message =
                document.getElementById("message").value;

            if (message.trim() === "")
                return;

            ws.send(JSON.stringify({

                type: "chat",
                username: username,
                message: message

            }));

            document.getElementById("message").value = "";

        }

        function privateMessage() {

            const receiver =
                document.getElementById("receiver").value;

            const message =
                document.getElementById("message").value;

            if (receiver.trim() === "" || message.trim() === "")
                return;

            ws.send(JSON.stringify({

                type: "private_chat",
                username: username,
                receiver: receiver,
                message: message

            }));

            document.getElementById("message").value = "";

        }

    </script>

</body>

</html>
